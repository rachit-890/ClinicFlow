spring:
  application:
    name: clinzo

  datasource:
    url: jdbc:postgresql://localhost:5432/clinzo
    username: clinzo
    password: clinzo
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8000

logging:
  level:
    com.clinzo: DEBUG
    org.hibernate.SQL: DEBUG
