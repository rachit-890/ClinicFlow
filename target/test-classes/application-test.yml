# Test profile — Testcontainers provides Postgres 16 and Redis 7 instances.
# Connection properties are injected dynamically by @DynamicPropertySource.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.clinzo: DEBUG
